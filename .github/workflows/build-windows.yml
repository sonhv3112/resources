name: Build installers

# Builds the self-contained installers on cloud runners, so you get a one-click
# macOS .dmg and a Windows Setup.exe without owning either machine.
# Run it from the GitHub "Actions" tab (Run workflow), or it runs on a version tag push.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed so GITHUB_TOKEN can create the release and upload assets

jobs:
  build-macos:
    runs-on: macos-14   # Apple Silicon (arm64)
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sidecar deps (camoufox + pyinstaller)
        run: |
          python3 -m venv ../.camoufox-venv
          ../.camoufox-venv/bin/python -m pip install --upgrade pip
          ../.camoufox-venv/bin/pip install "camoufox[geoip]" pyinstaller

      - name: Fetch Camoufox macOS binary
        run: ../.camoufox-venv/bin/python -m camoufox fetch

      - name: Locate Camoufox.app
        id: camoufox
        run: |
          app="$(find "$HOME/Library/Caches" "$HOME" -maxdepth 6 -type d -name 'Camoufox.app' 2>/dev/null | head -1)"
          if [ -z "$app" ]; then echo "Camoufox.app not found after fetch" >&2; exit 1; fi
          echo "Found Camoufox.app: $app"
          echo "app=$app" >> "$GITHUB_OUTPUT"

      - name: Freeze sidecar
        run: ./scripts/build-sidecar.sh

      - name: Package .app + .dmg
        env:
          CAMOUFOX_APP: ${{ steps.camoufox.outputs.app }}
        run: |
          ./scripts/package-macos.sh osx-arm64
          res="dist/GpmLite.app/Contents/Resources"
          # Fail loudly if the engine payloads didn't get bundled.
          test -d "$res/camoufox/Camoufox.app" || { echo "Camoufox not bundled" >&2; exit 1; }
          test -x "$res/sidecar/gpmlite-camoufox-sidecar/gpmlite-camoufox-sidecar" || { echo "sidecar not bundled" >&2; exit 1; }
          echo "=== dmg size ===" ; ls -lh dist/GpmLite.dmg

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: GpmLite-macos-dmg
          path: dist/GpmLite.dmg
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: dist/GpmLite.dmg

  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sidecar deps (camoufox + pyinstaller)
        shell: pwsh
        run: |
          python -m venv ..\.camoufox-venv
          ..\.camoufox-venv\Scripts\python -m pip install --upgrade pip
          ..\.camoufox-venv\Scripts\pip install "camoufox[geoip]" pyinstaller

      - name: Fetch Camoufox Windows binary
        shell: pwsh
        run: ..\.camoufox-venv\Scripts\python -m camoufox fetch

      - name: Locate Camoufox binary
        id: camoufox
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path $env:LOCALAPPDATA, $env:USERPROFILE -Recurse -Filter camoufox.exe -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $exe) { throw "camoufox.exe not found after fetch" }
          "dir=$($exe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Camoufox dir: $($exe.Directory.FullName)"

      - name: Freeze sidecar
        shell: pwsh
        run: .\scripts\build-sidecar.ps1

      - name: Package (folder + zip)
        shell: pwsh
        run: .\scripts\package-windows.ps1 -CamoufoxDir "${{ steps.camoufox.outputs.dir }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\scripts\installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GpmLite-Setup
          path: dist/GpmLite-Setup.exe
          if-no-files-found: error

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: GpmLite-win-x64-portable
          path: dist/GpmLite-win-x64.zip
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: |
            dist/GpmLite-Setup.exe
            dist/GpmLite-win-x64.zip
